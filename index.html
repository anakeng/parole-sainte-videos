<script>
function copier(el) {
  const texte = el.childNodes[0].textContent.trim();
  navigator.clipboard.writeText(texte).then(() => {
    const original = el.style.background;
    el.style.background = '#1e7e34';
    setTimeout(() => el.style.background = original, 600);
  });
}
</script>
